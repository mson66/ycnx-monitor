name: HK Mall Parking Sync (tx4)

on:
  schedule:
    - cron: '0 0 1 * *' # 每月 1 日運行
  workflow_dispatch:      # 支持手動運行

jobs:
  build_and_sync:
    runs-on: ubuntu-latest
    # 授予寫入權限，以便 push JSON 備份文件
    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run AI Scraping and Sync
        env:
          WX_APPID: ${{ secrets.WX_APPID }}
          WX_APPSECRET: ${{ secrets.WX_APPSECRET }}
          WX_ENV_ID: ${{ secrets.WX_ENV_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_malls.py

      - name: Commit and Push JSON backup
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # 確保路徑指向根目錄下的 data
          git add data/hkmallparkings.json
          git commit -m "chore: auto-update mall data (tx4)" || exit 0
          git push
