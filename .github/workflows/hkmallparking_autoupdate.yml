name: HK Mall Parking AI Update

on:
  # 定期執行：每月 1 日 00:00 UTC (即香港時間 08:00)
  schedule:
    - cron: '0 0 1 * *'
  
  # 支持手動在 GitHub 頁面點擊按鈕觸發
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install axios @cloudbase/node-sdk

      - name: Run AI Scraping and Sync
        env:
          # 以下環境變量需在 GitHub Repo -> Settings -> Secrets 中配置
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TENCENT_CLOUD_SECRET_ID: ${{ secrets.WX_APPID }}
          TENCENT_CLOUD_SECRET_KEY: ${{ secrets.WX_APPSECRET }}
          # 您的騰訊雲環境 ID
          TCB_ENV_ID: ${{ secrets.WX_ENV_ID }}
        run: node scripts/fetch_malls.js